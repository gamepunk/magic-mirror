<div class="page-head">
  <h1>关于</h1>
  <p class="lead">把屏幕上的任何内容变成实时悬浮镜像。</p>
</div>

<section class="content-section container-narrow">
  <p>Magic Mirror（魔镜）是一款屏幕镜像工具：网页任意区域、任意应用窗口、或屏幕上的任意一块，都能实时显示在置顶悬浮窗中。</p>
  <div class="doc-list" style="margin-top: 20px">
    <div class="doc-item"><strong>隐私优先</strong> —— 所有画面都在本地处理，不上传、不存储、无追踪。</div>
    <div class="doc-item"><strong>本地优先</strong> —— 无账号系统、无后端服务器、不收集任何使用数据。</div>
    <div class="doc-item"><strong>尊重用户</strong> —— 无广告、无暗坑。</div>
  </div>
</section>
