---
layout: default
lang: zh
title: 博客
lead: 产品动态与使用技巧。
---

<div class="page-head">
  <h1>博客</h1>
  <p class="lead">产品动态与使用技巧。</p>
</div>

<section class="content-section container-narrow">
  <div class="doc-list">
    {% assign posts = site.zh_posts | sort: "date" | reverse %}
    {% for post in posts %}
    <div class="post-card">
      <a href="{{ site.baseurl }}{{ post.url }}">
        <div class="date">{{ post.date | date: "%Y-%m-%d" }}</div>
        <h3>{{ post.title }}</h3>
        <p>{{ post.excerpt | strip_html | truncate: 120 }}</p>
      </a>
    </div>
    {% endfor %}
  </div>
</section>
